[project]
name = "satellite-command-center"
version = "0.1.0"
description = "Local command center for public SatNOGS satellite observations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "skyfield>=1.49"
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
